<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball League</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        h1 { text-align: center; color: #ffcc00; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        p { text-align: center; color: #aaa; margin-top: 0; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #2a2a2a; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #444; padding: 12px 8px; text-align: center; font-size: 14px; }
        th { background-color: #333; color: #ffcc00; }
        
        .jogos-container { margin-top: 20px; background: #222; padding: 15px; border-radius: 8px; max-height: 450px; overflow-y: auto; }
        .confronto-bloco { background: #2a2a2a; padding: 12px; margin-bottom: 12px; border-radius: 6px; border-left: 4px solid #ffcc00; }
        .confronto-titulo { font-weight: bold; color: #ffcc00; margin-bottom: 10px; font-size: 14px; text-align: center; }
        
        .jogo-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 4px; }
        
        .team-info { display: flex; align-items: center; gap: 8px; width: 160px; }
        .team-info.right { justify-content: flex-end; text-align: right; }
        .team-info.left { justify-content: flex-start; text-align: left; }
        
        .escudo { width: 24px; height: 24px; object-fit: contain; }
        
        input[type="number"] { width: 45px; text-align: center; background: #333; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 4px; font-weight: bold; font-size: 14px; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body onload="inicializar()">

    <div class="container">
        <h1>eFootball League</h1>
        <p>Confrontos em Turno Sêxtuplo (6 jogos contra cada adversário)</p>

        <h3 style="color: #ffcc00; margin-top: 25px;">Partidas e Placares</h3>
        <div class="jogos-container" id="jogos"></div>

        <h3 style="color: #ffcc00; margin-top: 35px;">Tabela de Classificação</h3>
        <table id="tabela">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Jogador</th>
                    <th>Pts</th>
                    <th>PJ</th>
                    <th>V</th>
                    <th>E</th>
                    <th>D</th>
                    <th>GP</th>
                    <th>GC</th>
                    <th>SG</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        const jogadores = [
            { nome: "VITOR90SHOW", time: "Barcelona", escudo: "barcelona.png" },
            { nome: "VITINHORJ", time: "Arsenal", escudo: "arsenal.png" },
            { nome: "BRINGMETHEORIZO", time: "Inter Milan", escudo: "inter.png" },
            { nome: "EOLUCKYZINJR", time: "Milan", escudo: "milan.png" },
            { nome: "BENED", time: "Palmeiras", escudo: "palmeiras.png" },
            { nome: "W7MASTERZZ", time: "Paris Saint-Germain", escudo: "psg.png" }
        ];

        let totalConfrontosCount = 0;

        function gerarConfrontos() {
            const divJogos = document.getElementById('jogos');
            divJogos.innerHTML = ""; 
            let globalIndex = 0;

            for (let i = 0; i < jogadores.length; i++) {
                for (let j = i + 1; j < jogadores.length; j++) {
                    let p1 = jogadores[i];
                    let p2 = jogadores[j];

                    let blocoHTML = `<div class="confronto-bloco">
                        <div class="confronto-titulo">${p1.nome} (${p1.time}) vs ${p2.nome} (${p2.time})</div>`;

                    for (let partidaNum = 1; partidaNum <= 6; partidaNum++) {
                        let mandante = (partidaNum % 2 !== 0) ? p1 : p2;
                        let visitante = (partidaNum % 2 !== 0) ? p2 : p1;

                        blocoHTML += `
                            <div class="jogo-item">
                                <div class="team-info left">
                                    <img src="${mandante.escudo}" class="escudo" onerror="this.src='https://via.placeholder.com/24/333/fff?text=X'">
                                    <span><b>${mandante.nome}</b></span>
                                </div>
                                <div>
                                    <input type="number" id="s1-${globalIndex}" data-time1="${mandante.nome}" data-time2="${visitante.nome}" oninput="atualizarTabela()" min="0"> x 
                                    <input type="number" id="s2-${globalIndex}" data-time1="${mandante.nome}" data-time2="${visitante.nome}" oninput="atualizarTabela()" min="0">
                                </div>
                                <div class="team-info right">
                                    <span><b>${visitante.nome}</b></span>
                                    <img src="${visitante.escudo}" class="escudo" onerror="this.src='https://via.placeholder.com/24/333/fff?text=X'">
                                </div>
                            </div>
                        `;
                        globalIndex++;
                    }
                    blocoHTML += `</div>`;
                    divJogos.innerHTML += blocoHTML;
                }
            }
            totalConfrontosCount = globalIndex;
        }

        function inicializar() {
            gerarConfrontos();
            atualizarTabela();
        }

        function atualizarTabela() {
            let stats = {};
            jogadores.forEach(j => stats[j.nome] = { pts: 0, pj: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, escudo: j.escudo, time: j.time });

            for (let i = 0; i < totalConfrontosCount; i++) {
                let el1 = document.getElementById(`s1-${i}`);
                let el2 = document.getElementById(`s2-${i}`);
                
                if (el1 && el2 && el1.value.trim() !== "" && el2.value.trim() !== "") {
                    let s1 = parseInt(el1.value);
                    let s2 = parseInt(el2.value);
                    let timeA = el1.getAttribute("data-time1");
                    let timeB = el1.getAttribute("data-time2");

                    if (stats[timeA] && stats[timeB]) {
                        stats[timeA].pj++;
                        stats[timeB].pj++;

                        stats[timeA].gp += s1;
                        stats[timeA].gc += s2;
                        stats[timeB].gp += s2;
                        stats[timeB].gc += s1;

                        if (s1 > s2) { 
                            stats[timeA].pts += 3; 
                            stats[timeA].v++; 
                            stats[timeB].d++; 
                        } else if (s2 > s1) { 
                            stats[timeB].pts += 3; 
                            stats[timeB].v++; 
                            stats[timeA].d++; 
                        } else { 
                            stats[timeA].pts += 1; 
                            stats[timeA].e++;
                            stats[timeB].pts += 1; 
                            stats[timeB].e++;
                        }
                    }
                }
            }

            let ranking = Object.keys(stats).map(name => ({ 
                name, ...stats[name], sg: stats[name].gp - stats[name].gc 
            }));

            ranking.sort((a, b) => b.pts - a.pts || b.v - a.v || b.sg - a.sg || b.gp - a.gp);

            const corpo = document.getElementById('corpo-tabela');
            corpo.innerHTML = "";

            ranking.forEach((item, index) => {
                corpo.innerHTML += `
                    <tr>
                        <td><b>#${index + 1}</b></td>
                        <td style="text-align: left; padding-left: 15px; display: flex; align-items: center; gap: 10px; border: none;">
                            <img src="${item.escudo}" class="escudo" onerror="this.src='https://via.placeholder.com/24/333/fff?text=X'">
                            <span><b>${item.name}</b> <small style="color: #888;">(${item.time})</small></span>
                        </td>
                        <td><b>${item.pts}</b></td>
                        <td>${item.pj}</td>
                        <td>${item.v}</td>
                        <td>${item.e}</td>
                        <td>${item.d}</td>
                        <td>${item.gp}</td>
                        <td>${item.gc}</td>
                        <td>${item.sg > 0 ? '+' + item.sg : item.sg}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
